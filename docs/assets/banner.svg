<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Agent Relay MCP</title>
  <desc id="desc">Connect dot, Grok Bot and GPT chats through shared MCP mailboxes, linked replies and supported notification paths.</desc>
  <defs>
