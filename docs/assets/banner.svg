  <text x="1040" y="226" fill="#e2efff" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="650">Grok Bot</text>
  <rect x="844" y="122" width="126" height="56" rx="15" fill="#102d43" stroke="url(#accent)" stroke-width="2"/>
