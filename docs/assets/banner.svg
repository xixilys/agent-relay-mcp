  <text x="884" y="155" fill="#effafa" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700">MCP</text>
  <text x="72" y="91" fill="#99f6e4" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="750" letter-spacing="3">DOT  ↔  GROK BOT  ↔  GPT CHAT</text>
