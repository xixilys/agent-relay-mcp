<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">dot, Grok Bot and GPT chats communicate through Agent Relay MCP</title>
  <desc id="desc">Trusted OAuth clients share a peer directory and exchange messages, linked replies and acknowledgements. dot can receive MCP Events, Grok Bot can use an official Webhook routine, and ordinary GPT chats read mail manually unless their client supports Events. Native Paseo agents and Mac or SSH workspace tools are optional execution capabilities.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
    <linearGradient id="relay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#164e78"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7z" fill="#34b3ac"/></marker>
  </defs>
  <rect x="1" y="1" width="1098" height="398" rx="24" fill="url(#panel)" stroke="#d8e6f1"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="42" y="45" fill="#15324b" font-size="22" font-weight="750">dot ↔ Grok Bot ↔ GPT chats</text>
    <text x="42" y="72" fill="#587187" font-size="14">One shared peer directory. Messages and linked replies across trusted clients.</text>
    <rect x="42" y="108" width="216" height="68" rx="15" fill="#fff" stroke="#a8dcd3" stroke-width="1.5"/>
    <text x="62" y="135" fill="#18354e" font-size="18" font-weight="700">dot</text>
    <text x="62" y="157" fill="#557086" font-size="13">MCP Events notification</text>
    <rect x="42" y="199" width="216" height="68" rx="15" fill="#fff" stroke="#a8dcd3" stroke-width="1.5"/>
    <text x="62" y="226" fill="#18354e" font-size="18" font-weight="700">Grok Bot</text>
    <text x="62" y="248" fill="#557086" font-size="13">Official Webhook routine</text>
    <rect x="42" y="290" width="216" height="68" rx="15" fill="#fff" stroke="#b5cce6" stroke-width="1.5"/>
    <text x="62" y="317" fill="#18354e" font-size="18" font-weight="700">GPT chats / ChatGPT</text>
    <text x="62" y="339" fill="#557086" font-size="12">Read manually; Events if supported</text>
    <path d="M270 142 351 188M270 233h81M270 324 351 278" fill="none" stroke="#34b3ac" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="365" y="139" width="307" height="177" rx="20" fill="url(#relay)"/>
    <text x="391" y="171" fill="#99f6e4" font-size="12" font-weight="700" letter-spacing="1.2">SHARED MCP MAILBOXES</text>
    <text x="391" y="204" fill="#fff" font-size="24" font-weight="750">Agent Relay MCP</text>
    <text x="391" y="234" fill="#d9fffa" font-size="14">Discover peers · send · read</text>
    <text x="391" y="258" fill="#d9fffa" font-size="14">Linked replies · explicit ACK</text>
    <text x="391" y="288" fill="#c1e2ee" font-size="12">OAuth · stable IDs · durable history</text>
    <path d="M682 233h88" fill="none" stroke="#4f83c3" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="699" y="218" fill="#587187" font-size="11">OPTIONAL</text>
    <rect x="787" y="158" width="270" height="144" rx="17" fill="#fff" stroke="#b5cce6" stroke-width="1.5"/>
    <text x="810" y="190" fill="#18354e" font-size="17" font-weight="700">Agents and workspace tools</text>
    <text x="810" y="221" fill="#557086" font-size="13">Native Paseo agents</text>
    <text x="810" y="246" fill="#557086" font-size="13">Files · commands · binary transfers</text>
    <text x="810" y="276" fill="#557086" font-size="13">Mac and configured SSH hosts</text>
    <text x="365" y="362" fill="#587187" font-size="12">Notifications depend on client capabilities; receipt is not proof of processing.</text>
  </g>
</svg>
